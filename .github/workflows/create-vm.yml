name: Try to Create OCI VM

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  try-create-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          pip install oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          region=${{ secrets.OCI_CLI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          export SUPPRESS_LABEL_WARNING=True
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True

      - name: Try to create ARM instance
        id: create
        run: |
          export SUPPRESS_LABEL_WARNING=True
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/ssh_key.pub

          # 查找最新的 Canonical Ubuntu 24.04 Minimal aarch64 镜像
          IMAGE_ID=$(oci compute image list \
            --compartment-id "${{ secrets.OCI_CLI_TENANCY }}" \
            --operating-system "Canonical Ubuntu" \
            --shape "VM.Standard.A1.Flex" \
            --limit 30 2>/dev/null | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          best = None
          for img in d['data']:
              n = img.get('display-name', '')
              if '24.04' in n and 'Minimal' in n and 'aarch64' in n:
                  if best is None or img.get('time-created','') > best.get('time-created',''):
                      best = img
          if best:
              print(best['id'])
          ")
          echo "镜像: $IMAGE_ID"
          if [ -z "$IMAGE_ID" ]; then
            echo "❌ 找不到 Ubuntu 24.04 Minimal aarch64 镜像"
            exit 1
          fi

          oci compute instance launch \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --availability-domain "${{ secrets.AD_NAME }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file /tmp/ssh_key.pub \
            --boot-volume-size-in-gbs 50 \
            --display-name "arm-instance" \
            --assign-public-ip true \
            --wait-for-state RUNNING \
            --max-wait-seconds 120 2>&1 | tee /tmp/create.log
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "✅ 实例创建成功！"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "❌ 创建失败，10分钟后重试"
            cat /tmp/create.log
          fi

      - name: Report result
        run: |
          if [ "${{ steps.create.outputs.success }}" = "true" ]; then
            echo "🎉 ARM 实例已创建！请立即去 GitHub 禁用此 workflow，避免重复创建。"
          else
            echo "⏳ 本次未抢到，等待下次自动重试。"
          fi
